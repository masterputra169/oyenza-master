<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DollarKilat Edge API</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; border-radius: 12px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; max-width: 480px; text-align: center; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 9999px; background: rgba(34, 197, 94, 0.2); color: #4ade80; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
    h1 { margin: 0 0 12px; font-size: 24px; color: #fff; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
    code { background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Edge API Active</div>
    <h1>DollarKilat Market Hub</h1>
    <p>Centralized market data aggregator & edge cache for <b>Oyenza Master</b>.</p>
    <p>Endpoints: <code>/health</code>, <code>/v1/us-stocks/*</code>, <code>/v1/forex/*</code>, <code>/v1/crypto/*</code></p>
  </div>
</body>
</html>
